; uzcTest_i2s_bt Master — MP3TEST2/Arduino/master (SD_I2S)
; SDK pinned per-project (.pio/libdeps is local to this folder).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM7
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-cpp
    -Wno-deprecated-declarations

[env:esp32dev_s115200]
extends = env:esp32dev
upload_speed = 115200

[env:esp32dev_s230400]
extends = env:esp32dev
upload_speed = 230400

[env:esp32dev_s460800]
extends = env:esp32dev
upload_speed = 460800
