; mp3test — standalone ESP32: embedded UZC MP3 slot / RAW sine -> I2S speaker
; Based on sintest_i2s_spk slave output path + sintest_i2s_mp3 master CLI

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-cpp
    -Wno-deprecated-declarations
build_src_flags =
    -Wno-volatile
    -Wno-pedantic

[env:esp32dev_s115200]
extends = env:esp32dev
upload_speed = 115200

[env:esp32dev_s230400]
extends = env:esp32dev
upload_speed = 230400

[env:esp32dev_s460800]
extends = env:esp32dev
upload_speed = 460800
