; uzcTest_i2s_bt Slave — uzuCastSubMP3 (I2S RX -> BT A2DP)
; lib_deps and .pio/libdeps are scoped to this project directory only.

[platformio]
default_envs = esp32dev_s460800

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -Wno-cpp
    -Wno-deprecated-declarations
build_src_flags =
    -Wno-volatile
    -Wno-pedantic

[env:esp32dev_s115200]
extends = env:esp32dev
upload_speed = 115200

[env:esp32dev_s230400]
extends = env:esp32dev
upload_speed = 230400

[env:esp32dev_s460800]
extends = env:esp32dev
upload_speed = 460800
