; UzuCast V3 Main — ESP32-S3 / Arduino 3.3.9
; Shared platform + framework with uzuCastV3_Sub (no SDK reinstall on switch)

[platformio]
default_envs = esp32s3_s460800

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM5
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.boot = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/app3M_fat9M_16MB.csv
board_upload.maximum_size = 3145728
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
lib_deps =
    links2004/WebSockets @ ^2.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DUZU_SKIP_POWER_BUTTON=1
    -DUZU_ENABLE_I2C=0
    -Wno-cpp
    -Wno-deprecated-declarations
build_src_flags =
    -Wno-volatile
    -Wno-pedantic

; Upload speed variants (selected by writemaster.bat /s xxxxx; default env = 921600)
[env:esp32s3_s115200]
extends = env:esp32s3
upload_speed = 115200

[env:esp32s3_s230400]
extends = env:esp32s3
upload_speed = 230400

[env:esp32s3_s460800]
extends = env:esp32s3
upload_speed = 460800
