; TDM-I2S-TEST Master — ESP32-S3 / TDM 8ch TX (CH1=data, CH8=tag)
; Communication path test: no SD, no BT.

[platformio]
default_envs = esp32s3_s460800

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM5
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.boot = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -Wno-cpp
    -Wno-deprecated-declarations

[env:esp32s3_s115200]
extends = env:esp32s3
upload_speed = 115200

[env:esp32s3_s230400]
extends = env:esp32s3
upload_speed = 230400

[env:esp32s3_s460800]
extends = env:esp32s3
upload_speed = 460800
